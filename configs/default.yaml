# DesktopAgentBench — Default Configuration

split: dev
repetitions: 5
confidence_level: 0.95

chaos_profiles:
  - clean
  - moderate
  - severe

generate_isolated_variants: true

tasks_dir: tasks
results_dir: results
chaos_profiles_dir: configs/chaos_profiles

agent: "builtin:noop"

environment:
  use_vm: false
  screen_resolution: [1920, 1080]
  dpi_scale: 1.0

global_timeout_minutes: 240
