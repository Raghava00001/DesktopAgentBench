# Mild chaos profile — light disruptions for warmup testing

profile_name: mild
description: "Light disruptions — occasional notifications and minor delays"

popup_spawner:
  enabled: false

focus_stealer:
  enabled: false

ui_delay:
  enabled: true
  frequency_range: [30, 90]
  delay_range_ms: [200, 800]
  probability: 0.15

window_resizer:
  enabled: false

uac_faker:
  enabled: false

notification_spoofer:
  enabled: true
  frequency_range: [30, 60]
  notification_types: ["email"]

scroll_hider:
  enabled: false

randomization:
  seed: null
  injection_jitter_pct: 10
