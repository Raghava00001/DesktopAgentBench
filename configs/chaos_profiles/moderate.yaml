# Moderate chaos profile — realistic busy-workday disruptions

profile_name: moderate
description: "Realistic disruption level — what a user might experience on a busy workday"

popup_spawner:
  enabled: true
  frequency_range: [15, 45]
  duration_range: [3, 10]
  popup_types: ["update", "sync", "notification"]
  max_concurrent: 2

focus_stealer:
  enabled: true
  frequency_range: [20, 60]
  steal_duration_range: [1, 3]

ui_delay:
  enabled: true
  frequency_range: [20, 60]
  delay_range_ms: [500, 2000]
  probability: 0.3

window_resizer:
  enabled: true
  frequency_range: [30, 90]
  resize_magnitude: medium

uac_faker:
  enabled: false

notification_spoofer:
  enabled: true
  frequency_range: [10, 30]
  notification_types: ["email", "chat", "calendar"]

scroll_hider:
  enabled: false

randomization:
  seed: null
  injection_jitter_pct: 20
